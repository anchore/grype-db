# validate:

listing:
  image: "alpine:3.9.2"
  minimum-packages: 5
  minimum-vulnerabilities: 40

expected-providers:
  - alma
  - alpine
  - arch
  - amazon
  - bitnami
  - chainguard
  - chainguard-libraries
  - debian
  - echo
  - epss
  - github
  - kev
  - mariner
  - minimos
  - nvd
  - oracle
  - rhel
  - sles
  - ubuntu
  - wolfi

# new vulnerabilities are added all the time, instead of keeping up it's easier to ignore newer entries.
# This approach helps tremendously with keeping the analysis relatively stable.
default-max-year: 2021

# where every gate reads labels and SBOMs from. Pinned so labels can't change under the gate between runs; to bump,
# use the "commit" from https://yardstick.anchore.io/claims/matches/latest-v1.json (the last published anchore/claims
# snapshot). Add grype's test/integration/additional-claims (pinned the same way) once it holds labels.
claims:
  - github.com/anchore/claims@f2bef354324428f961262d87adec716bb669338f

gates:
  # each entry becomes one yardstick gate (see https://github.com/anchore/yardstick/blob/main/docs/gate-file.md): grype
  # with the newly built DB (the candidate) vs the same grype with the published DB (the reference). Unlabeled matches
  # that only one side reports leave the F1 and FN checks undecided, which passes. A gate still fails on:
  #   - a decided F1 or FN regression beyond the limits below
  #   - more unlabeled changes than max_unlabeled_changes on any image
  #   - an image the two sides disagree on that has no tp/fp label (after max_year) to decide it
  #   - an image neither side reports any match on
  - gate:
      # float between 0 and 1, how far below the reference's F1 score the candidate's may be on any image
      max_f1_regression: 0.15

      # integer, how many true positives the reference finds may be missed by the candidate on any image
      max_new_false_negatives: 10

      # integer, how many matches only one side reports may stay unlabeled on any image
      max_unlabeled_changes: 50

    # these are the set of images we will capture grype scans for using an existing published DB and a newly build DB.
    # The assumption is that they should perform similarly or the new DB should perform better. We do allow for the new
    # DB to perform slightly worse based on the above gate configuration, but not by much. These images are NOT
    # meant to be exhaustive or even cover all namespaces.
    # note: always reference images by digest, named the way anchore/claims stores their labels
    images:
      - ghcr.io/anchore/test-images/grype-quality-node@sha256:f56164678054e5eb59ab838367373a49df723b324617b1ba6de775749d7f91d4
      - ghcr.io/anchore/test-images/grype-quality-python@sha256:b2b58a55c0b03c1626d2aaae2add9832208b02124dda7b7b41811e14f0fb272c
      - ghcr.io/anchore/test-images/grype-quality-java@sha256:b3534fc2e37943136d5b54e3a58b55d4ccd4363d926cf7aa5bf55a524cf8275b
      - ghcr.io/anchore/test-images/grype-quality-golang@sha256:7536ee345532f674ec9e448e3768db4e546c48220ba2b6ec9bc9cfbfb3b7b74a
      - ghcr.io/anchore/test-images/grype-quality-ruby@sha256:1a5a5f870924e88a6f0f2b8089cf276ef0a79b5244a052cdfe4a47bb9e5a2c10
      - docker.io/alpine:3.2@sha256:ddac200f3ebc9902fb8cfcd599f41feb2151f1118929da21bcef57dc276975f9
      - docker.io/debian:7@sha256:81e88820a7759038ffa61cff59dfcc12d3772c3a2e75b7cfe963c952da2ad264
      - registry.access.redhat.com/ubi8@sha256:68fecea0d255ee253acbf0c860eaebb7017ef5ef007c25bee9eeffd29ce85b29
      - docker.io/ubuntu:20.04@sha256:9d42d0e3e57bc067d10a75ee33bdd1a5298e95e5fc3c5d1fce98b455cb879249

  - gate:
      max_year: 2022 # important - Azure Linux 3 doesn't have enough CVEs going back to 2021
      max_f1_regression: 0.15
      max_new_false_negatives: 10
      max_unlabeled_changes: 50

    images:
      - ghcr.io/anchore/test-images/azurelinux3@sha256:2d761ba36575ddd4e07d446f4f2a05448298c20e5bdcd3dedfbbc00f9865240d
